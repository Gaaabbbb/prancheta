UI.pickFile = (accept, fn) => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.style.display = 'none';
  inp.onchange = () => { const f = inp.files[0]; inp.remove(); if (f) fn(f); };
  document.body.appendChild(inp); inp.click();
};

UI.normHex = (v, def) => { v = String(v || '').trim(); if (/^#?[0-9a-f]{6}$/i.test(v)) return ('#' + v.replace('#', '')).toUpperCase(); return def; };

UI.readDB = async file => {
  const X = await UI.loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const find = name => wb.SheetNames.find(n => G.normName(n) === name);
  const sc = find('clubes'), sj = find('jogadores'), sb = find('base');
  if (!sc || !sj) throw new Error('A planilha precisa ter as abas “Clubes” e “Jogadores”.');
  const table = sh => {
    const rows = X.utils.sheet_to_json(wb.Sheets[sh], { header: 1, defval: '' });
    const hi = rows.findIndex(r => r.some(x => G.normName(x) === 'clube'));
    if (hi < 0) throw new Error('Não achei a linha de cabeçalho (com “Clube”) na aba ' + sh + '.');
    const head = rows[hi].map(G.normName);
    const col = (...keys) => head.findIndex(h => keys.some(k => h === k || h.startsWith(k)));
    return { rows: rows.slice(hi + 1), col, line0: hi + 2 };
  };
  const errs = [];
  // clubes
  const C = table(sc);
  const ci = { n: C.col('clube'), s: C.col('sigla'), div: C.col('divisao'), uf: C.col('uf'), std: C.col('estadio'), cap: C.col('capacidade'), rep: C.col('reputacao'), c1: C.col('cor 1', 'cor1'), c2: C.col('cor 2', 'cor2'), grp: C.col('grupo') };
  if (ci.div < 0) throw new Error('A aba Clubes precisa da coluna “Divisão”.');
  const clubs = [];
  C.rows.forEach((r, i) => {
    const n = String(r[ci.n] || '').trim(); if (!n) return;
    const g = ci.grp >= 0 ? parseInt(r[ci.grp], 10) : NaN;
    clubs.push({
      n, s: ci.s >= 0 ? String(r[ci.s] || '').trim().toUpperCase().slice(0, 3) || null : null,
      div: String(r[ci.div] || '').trim().toUpperCase(), uf: ci.uf >= 0 ? String(r[ci.uf] || '').trim().toUpperCase() : '',
      std: ci.std >= 0 ? String(r[ci.std] || '').trim() : '', cap: ci.cap >= 0 ? +r[ci.cap] || 0 : 0, rep: ci.rep >= 0 ? +r[ci.rep] || 0 : 0,
      c1: UI.normHex(ci.c1 >= 0 ? r[ci.c1] : '', '#888888'), c2: UI.normHex(ci.c2 >= 0 ? r[ci.c2] : '', '#FFFFFF'),
      grp: g >= 1 && g <= 16 ? g - 1 : -1, line: C.line0 + i
    });
  });
  // jogadores
  const J = table(sj);
  const ji = { club: J.col('clube'), n: J.col('nome'), p: J.col('posicao'), a: J.col('idade'), o: J.col('nota', 'ovr'), real: J.col('origem'), nat: J.col('nacionalidade') };
  if (ji.n < 0 || ji.p < 0 || ji.o < 0) throw new Error('A aba Jogadores precisa das colunas Clube, Nome, Posição, Idade e Nota.');
  const players = [];
  J.rows.forEach((r, i) => {
    const n = String(r[ji.n] || '').trim(); if (!n) return;
    const p = String(r[ji.p] || '').trim().toUpperCase();
    const club = String(r[ji.club] || '').trim();
    if (!G.POS.includes(p)) { errs.push('Jogadores, linha ' + (J.line0 + i) + ': posição “' + p + '” inválida'); return; }
    if (!club) { errs.push('Jogadores, linha ' + (J.line0 + i) + ': sem clube'); return; }
    players.push({ club, n, p, a: G.clamp(parseInt(r[ji.a], 10) || 25, 15, 50), o: G.clamp(parseInt(r[ji.o], 10) || 50, 1, 99), real: ji.real >= 0 ? G.normName(r[ji.real]) === 'real' : true, nat: ji.nat >= 0 ? String(r[ji.nat] || '').trim() || 'Brasil' : 'Brasil', line: J.line0 + i });
  });
  // base (opcional)
  const youth = [];
  if (sb) {
    const B = table(sb);
    const bi = { club: B.col('clube'), n: B.col('nome'), p: B.col('posicao'), a: B.col('idade'), o: B.col('nota', 'ovr'), pt: B.col('potencial'), real: B.col('origem'), nat: B.col('nacionalidade') };
    B.rows.forEach((r, i) => {
      const n = String(r[bi.n] || '').trim(); if (!n) return;
      const p = String(r[bi.p] || '').trim().toUpperCase(), club = String(r[bi.club] || '').trim();
      if (!G.POS.includes(p) || !club) { errs.push('Base, linha ' + (B.line0 + i) + ': posição ou clube inválido'); return; }
      const o = G.clamp(parseInt(r[bi.o], 10) || 40, 1, 99);
      youth.push({ club, n, p, a: G.clamp(parseInt(r[bi.a], 10) || 17, 14, 21), o, pt: bi.pt >= 0 ? G.clamp(parseInt(r[bi.pt], 10) || o + 10, o, 99) : o + 10, real: bi.real >= 0 ? G.normName(r[bi.real]) === 'real' : true, nat: bi.nat >= 0 ? String(r[bi.nat] || '').trim() || 'Brasil' : 'Brasil' });
    });
  }
  // jogadores com clube que não existe na aba Clubes
  const known = new Set(clubs.map(c => G.normName(c.n))), knownS = new Set(clubs.filter(c => c.s).map(c => c.s));
  const orphan = [...players, ...youth].filter(p => !known.has(G.normName(p.club)) && !knownS.has(p.club.toUpperCase()));
  if (orphan.length) { const names = [...new Set(orphan.map(p => p.club))]; errs.push(orphan.length + ' jogador(es) com clube que não está na aba Clubes: ' + names.slice(0, 6).join(', ') + (names.length > 6 ? '…' : '')); }
  return { clubs, players, youth, errs };
};

  ${rep.divs ? `<p class="muted" style="margin-top:12px">${rep.divs} clube(s) com divisão diferente na planilha. Mudanças de divisão só valem numa carreira nova.</p>` : ''}
  ${rep.unknown.length ? `<p class="muted">Clubes que não existem no jogo foram ignorados: ${rep.unknown.slice(0, 8).map(esc).join(', ')}${rep.unknown.length > 8 ? '…' : ''}</p>` : ''}
  ${db.errs.length ? `<p class="muted">Avisos: ${db.errs.slice(0, 8).map(esc).join('; ')}</p>` : ''}`);
});

UI.applyDB = db => {
  const rep = { clubs: 0, upd: 0, add: 0, mov: 0, del: 0, fill: 0, divs: 0, unknown: [] };
  const bySig = {}, byName = {};
  W.clubs.forEach(c => { bySig[c.s.toUpperCase()] = c; byName[G.normName(c.n)] = c; });
  const sheetToClub = {};
  for (const d of db.clubs) {
    const c = (d.s && bySig[d.s]) || byName[G.normName(d.n)];
    if (!c) { rep.unknown.push(d.n); continue; }
    sheetToClub[G.normName(d.n)] = c; if (d.s) sheetToClub[d.s] = c;
    c.n = d.n; if (d.s) c.s = d.s; if (d.uf) c.uf = d.uf; if (d.std) c.std = d.std; if (d.cap > 0) c.cap = d.cap; if (d.rep > 0) c.rep = G.clamp(d.rep, 1, 99);
    c.c1 = d.c1; c.c2 = d.c2;
    if (d.div !== c.div) rep.divs++;
    rep.clubs++;
  }
  const resolve = name => sheetToClub[G.normName(name)] || sheetToClub[String(name).toUpperCase()] || byName[G.normName(name)] || bySig[String(name).toUpperCase()];
  const byPName = {};
  W.players.forEach(p => { const k = G.normName(p.n); (byPName[k] = byPName[k] || []).push(p); });
  const keep = new Set(), touchedP = new Set(), touchedY = new Set();
  const rows = [...db.players.map(d => Object.assign({ y: 0 }, d)), ...(db.youth || []).map(d => Object.assign({ y: 1 }, d))];
  for (const d of rows) {
    const c = resolve(d.club);
    if (!c) { if (!rep.unknown.includes(d.club)) rep.unknown.push(d.club); continue; }
    (d.y ? touchedY : touchedP).add(c.id);
    const cands = (byPName[G.normName(d.n)] || []).filter(p => !keep.has(p.id));
    let p = cands.find(x => x.c === c.id && !!x.y === !!d.y) || cands.find(x => x.c === c.id);
    if (!p && cands.length === 1) { p = cands[0]; p.c = c.id; rep.mov++; }
    if (p) {
      if (p.p !== d.p) { p.p = d.p; p.at = G.genAttrs(d.p, d.o); }
      else for (let k = 0; k < 4 && Math.abs(G.ovr(p) - d.o) >= 1; k++) G.shiftOvr(p, d.o - G.ovr(p));
      p.a = d.a; p.real = d.real; if (d.nat) p.nat = d.nat;
      if (d.y && !p.y && p.a <= 21) G.demote(W, p); else if (!d.y && p.y) G.promote(W, p, true);
      p.pt = d.y && d.pt ? Math.max(G.ovr(p) + 1, d.pt) : Math.max(p.pt, G.ovr(p));
      rep.upd++;
    } else {
      p = G.makePlayer(W, c.id, d.n, d.p, d.a, d.o, d.real, { y: d.y, pt: d.pt, nat: d.nat }); rep.add++;
    }
    keep.add(p.id);
  }
  G.dirty(W);
  const gone = W.players.filter(p => (p.y ? touchedY : touchedP).has(p.c) && !keep.has(p.id));
  rep.del = gone.filter(p => p.real).length;
  const goneFill = gone.filter(p => !p.real && !p.y).length;
  const goneIds = new Set(gone.map(p => p.id));
  W.players = W.players.filter(p => !goneIds.has(p.id));
  W.pmap = {}; W.players.forEach(p => W.pmap[p.id] = p); G.dirty(W);
  const touched = new Set([...touchedP, ...touchedY]);
  for (const id of touched) { rep.fill += G.fillSquad(W, W.clubs[id]).length; }
  rep.fill = Math.max(0, rep.fill - goneFill);
  for (const p of W.players) { p.val = G.calcValue(p); p.sal = p.y ? 0 : G.calcWage(p, W.clubs[p.c].div); }
  for (const c of W.clubs) {
    if (c.lineup) c.lineup = c.lineup.map(id => W.pmap[id] && W.pmap[id].c === c.id ? id : null);
    if (c.bench) c.bench = c.bench.filter(id => W.pmap[id] && W.pmap[id].c === c.id);
    if (c.id === W.user) G.validateLineup(W, c); else if (touched.has(c.id)) G.autoLineup(W, c);
  }
  return rep;
};

UI.act.exportSheet = async () => {
  let X;
  try { X = await UI.loadXLSX(); } catch (e) { UI.toast(e.message, 5000); return; }
  const DIVORD = { A: 0, B: 1, C: 2, D: 3 };
  const clubs = W.clubs.slice().sort((a, b) => DIVORD[a.div] - DIVORD[b.div] || (a.div === 'D' ? (a.grp - b.grp) : 0) || b.rep - a.rep);
  const corder = {}; clubs.forEach((c, i) => corder[c.id] = i);
  const players = W.players.filter(p => p.c >= 0 && !p.y).sort((a, b) => corder[a.c] - corder[b.c] || G.POS.indexOf(a.p) - G.POS.indexOf(b.p) || G.ovr(b) - G.ovr(a));
  const cnt = {}, sum = {};
  players.forEach(p => { cnt[p.c] = (cnt[p.c] || 0) + 1; sum[p.c] = (sum[p.c] || 0) + G.ovr(p); });

  if (L.goalFlash > 0) { ctx.fillStyle = `rgba(255,210,63,${L.goalFlash * .25})`; ctx.fillRect(0, 0, w, h); }
  const r = Math.max(7, w / 95);
  ctx.font = `700 ${Math.round(r * 1.05)}px Saira Condensed, Arial Narrow, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of L.m.sides) {
    const c = L.col[s.idx];
    for (const o of s.on) {
      const p = L.pos[o.pl.id]; if (!p) continue;
      const isGK = o.role === 'GOL';
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y) + 2, r, 0, 7); ctx.fillStyle = '#0005'; ctx.fill();
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r, 0, 7); ctx.fillStyle = isGK ? (s.idx ? '#7C3AED' : '#F97316') : c.f; ctx.fill();
      ctx.lineWidth = 2.2; ctx.strokeStyle = isGK ? '#fff' : c.s; ctx.stroke();
      ctx.fillStyle = UI.isLight(isGK ? '#777' : c.f) ? '#111' : '#fff';
      ctx.fillText(String((o.slot || 0) + 1), X(p.x), Y(p.y) + .5);
      if (o.pl.id === L.carrier) { ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), r + 4, 0, 7); ctx.strokeStyle = '#FFD23F'; ctx.lineWidth = 2; ctx.stroke(); }
    }
  }
  const carr = L.carrier && W.pmap[L.carrier];
  if (carr && L.pos[carr.id]) { const p = L.pos[carr.id]; ctx.font = `600 12px Saira Semi Condensed, sans-serif`; const t = carr.n; const tw = ctx.measureText(t).width; ctx.fillStyle = '#0E1828cc'; ctx.fillRect(X(p.x) - tw / 2 - 4, Y(p.y) - r - 20, tw + 8, 16); ctx.fillStyle = '#EDEAE0'; ctx.fillText(t, X(p.x), Y(p.y) - r - 12); }
  const b = L.ball, lift = Math.sin(Math.PI * Math.min(1, b.t)) * (Math.hypot(b.tx - b.fx, b.ty - b.fy) > .25 ? 8 : 2);
  ctx.beginPath(); ctx.arc(X(b.x) + 2, Y(b.y) + 3, 4, 0, 7); ctx.fillStyle = '#0006'; ctx.fill();
  ctx.beginPath(); ctx.arc(X(b.x), Y(b.y) - lift, 4.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();
  if (L.goalFlash > .3) { ctx.font = `800 ${Math.round(h / 4)}px Saira Condensed, sans-serif`; ctx.fillStyle = `rgba(255,210,63,${Math.min(1, L.goalFlash * 1.4)})`; ctx.strokeStyle = '#0E1828'; ctx.lineWidth = 6; ctx.strokeText('GOL', w / 2, h / 2); ctx.fillText('GOL', w / 2, h / 2); }
  if (L.paused) { ctx.fillStyle = '#0E1828aa'; ctx.fillRect(0, 0, w, h); ctx.font = `700 28px Saira Condensed, sans-serif`; ctx.fillStyle = '#EDEAE0'; ctx.fillText('Pausado', w / 2, h / 2); }
};
UI.act.lPause = () => { const L = UI.L; if (!L) return; L.paused = !L.paused; $('#lpause').textContent = L.paused ? 'Continuar' : 'Pausar'; };
UI.act.lSpeed = v => { const L = UI.L; L.speed = +v; UI._spd = +v; document.querySelectorAll('#lspd button').forEach((b, i) => b.classList.toggle('on', i === +v)); };
UI.act.lSkip = () => { const L = UI.L; if (!L || L.m.ended) return; L.paused = false; while (!L.m.ended) UI.handleEvents(L.m.step().filter(e => e.imp >= 2), 1); L.hold = 0; };

// ----- painel de tática durante o jogo -----
UI.act.lTac = () => {
  const L = UI.L; if (!L) return; L.paused = true; $('#lpause').textContent = 'Continuar';
  UI.renderTacPanel();
};
UI.renderTacPanel = () => {
  const L = UI.L, s = L.m.sides[L.m.userSide];
  let pn = $('.side-panel'); if (!pn) { pn = document.createElement('div'); pn.className = 'side-panel'; $('#match').appendChild(pn); }
  const seg = (key, arr) => `<div class="seg">${arr.map((l, i) => `<button class="${s.tac[key] === i ? 'on' : ''}" data-a="lTacSet" data-v="${key}:${i}">${l}</button>`).join('')}</div>`;
  const onRows = s.on.map(o => { const p = o.pl; const rt = (s.rat[p.id] || 6).toFixed(1); return `<div class="subrow ${L.sel === p.id ? 'sel' : ''}" data-a="lSelOn" data-v="${p.id}">${UI.pos(o.role)}<span class="nm">${esc(p.n)}${s.yel[p.id] ? ' <span class="tag sus">AM</span>' : ''}</span>${UI.ovr(G.ovrRole(p, o.role))}<span>${UI.fitBar(p.f)}</span><span class="num muted">${rt}</span></div>`; }).join('');
  const benchRows = s.bench.map(p => { const used = s.played.has(p.id); return `<div class="subrow ${used || s.subs >= 5 ? 'dis' : ''}" ${used || s.subs >= 5 ? '' : `data-a="lSub" data-v="${p.id}"`}>${UI.pos(p.p)}<span class="nm">${esc(p.n)}</span>${UI.ovr(G.ovr(p))}<span>${UI.fitBar(p.f)}</span><span></span></div>`; }).join('');
  pn.innerHTML = `<div class="mh" style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><h2 style="flex:1">Tática e substituições</h2><button class="btn pri" data-a="lTacClose">Voltar ao jogo</button></div>
  <div class="ctl" style="margin-bottom:16px"><label>Formação</label><select data-c="lForm">${G.FORM_KEYS.map(f => `<option ${f === s.tac.f ? 'selected' : ''}>${f}</option>`).join('')}</select>
  <label>Mentalidade</label>${seg('men', ['Muito def.', 'Defensiva', 'Equilibrada', 'Ofensiva', 'Muito of.'])}<label>Marcação</label>${seg('pres', G.PRESS)}<label>Ritmo</label>${seg('temp', G.TEMPO)}<label>Linha</label>${seg('lin', G.LINE)}</div>
  <div class="grid g2"><div><h3 style="margin-bottom:6px">Em campo <small class="muted" style="font-family:var(--fb);font-size:12px">clique em quem vai sair</small></h3>${onRows}</div>
  <div><h3 style="margin-bottom:6px">Banco <small class="muted" style="font-family:var(--fb);font-size:12px">${5 - s.subs} trocas restantes</small></h3>${benchRows || '<p class="muted">Banco vazio.</p>'}</div></div>`;
};
UI.act.lTacSet = v => { const [k, i] = v.split(':'); UI.L.m.setTactic(UI.L.m.userSide, { [k]: +i }); UI.renderTacPanel(); };
UI.chg.lForm = v => { UI.L.m.setTactic(UI.L.m.userSide, { f: v }); UI.renderTacPanel(); };
UI.act.lSelOn = v => { UI.L.sel = UI.L.sel === +v ? null : +v; UI.renderTacPanel(); };
UI.act.lSub = v => {
  const L = UI.L, s = L.m.sides[L.m.userSide];
  if (!L.sel) { UI.toast('Primeiro escolha quem sai, na lista “Em campo”.'); return; }
  const outPl = W.pmap[L.sel], inPl = W.pmap[+v];
  if (L.m.doSub(s, outPl, inPl)) { L.sel = null; UI.handleEvents([L.m.events[L.m.events.length - 1]], 300); UI.renderTacPanel(); }
};
UI.act.lTacClose = () => { const pn = $('.side-panel'); if (pn) pn.remove(); const L = UI.L; L.paused = false; $('#lpause').textContent = 'Pausar'; };

UI.liveEnd = () => {
  const L = UI.L; if (!L) return;
  const m = L.m;
  const ratTable = s => [...s.played].map(id => W.pmap[id]).map(p => ({ p, r: G.clamp(s.rat[p.id] || 6, 3, 10), g: m.goals.filter(g => g.pid === p.id && g.side === s.idx).length })).sort((a, b) => b.r - a.r);
  const all = [...ratTable(m.sides[0]).map(x => Object.assign(x, { s: 0 })), ...ratTable(m.sides[1]).map(x => Object.assign(x, { s: 1 }))];
  const motm = all.slice().sort((a, b) => b.r - a.r)[0];
  const tbl = s => `<table class="t"><tbody>${ratTable(m.sides[s]).map(x => `<tr><td class="nm">${esc(x.p.n)}${x.g ? ' ' + '⚽'.repeat(x.g) : ''}</td><td class="r num"><b style="color:${x.r >= 7.5 ? 'var(--ok)' : x.r < 6 ? '#ff9a9d' : 'var(--chalk)'}">${x.r.toFixed(1)}</b></td></tr>`).join('')}</tbody></table>`;
  const pen = m.penLog ? `<p style="text-align:center;margin:6px 0 0">Pênaltis: ${m.sides[0].pens} x ${m.sides[1].pens}</p>` : '';
  const pn = document.createElement('div'); pn.className = 'side-panel';
  pn.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><h2 style="flex:1">Fim de jogo: ${esc(m.sides[0].club.n)} ${m.sides[0].goals} x ${m.sides[1].goals} ${esc(m.sides[1].club.n)}</h2><button class="btn pri big" data-a="liveClose" autofocus>Continuar</button></div>${pen}
  <p class="muted" style="margin:0 0 12px">Melhor em campo: <b style="color:var(--chalk)">${esc(motm.p.n)}</b> (${motm.r.toFixed(1)})</p>
  <div class="grid g2"><div><h3 style="margin-bottom:6px">${esc(m.sides[0].club.n)}</h3>${tbl(0)}</div><div><h3 style="margin-bottom:6px">${esc(m.sides[1].club.n)}</h3>${tbl(1)}</div></div>`;
  $('#match').appendChild(pn);
  const b = pn.querySelector('[autofocus]'); if (b) b.focus();
};
UI.act.liveClose = () => {
  const L = UI.L; if (!L) return;
  cancelAnimationFrame(L.raf); window.removeEventListener('resize', UI.sizePitch);
  const el = $('#match'); if (el) el.remove();
  UI.L = null; UI.liveKey = null;
  UI.afterUserMatch(L.uf, L.m);
};

UI.afterUserMatch = (uf, m) => {
  G.playDay(W, m);
  UI.save(); UI.render();
  UI.roundModal(uf);
};
UI.roundModal = uf => {
  const comp = uf.comp, f = uf.f, st = comp.stages[f.st];
  const fx = comp.fx.filter(x => x.d === f.d);
  const mine = f;
  const home = f.h === W.user, gf = home ? f.hg : f.ag, ga = home ? f.ag : f.hg;
  const head = gf > ga ? 'Vitória' : gf < ga ? 'Derrota' : 'Empate';
  const s = UI.userStanding();
  let mini = '';
  if (s && st.type === 'league') {
    const i = s.pos - 1, from = Math.max(0, Math.min(i - 3, s.table.length - 7));
    mini = `<table class="t"><tbody>${s.table.slice(from, from + 7).map((r, k) => `<tr class="${r.c === W.user ? 'me' : ''}"><td class="num"><span class="zone ${UI.zoneOf(s.comp, s.si, s.gi, from + k + 1, s.table.length)}"></span>${from + k + 1}</td><td class="nm">${UI.cname(r.c)}</td><td class="r num">${r.j}</td><td class="r num"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`;
  }
  const list = fx.filter(x => st.type !== 'league' || st.groups.length === 1 || x.g === f.g || true).slice(0, 40);
  UI.modal(`<div class="mh"><h2>${head}: ${UI.cname(f.h)} ${f.hg} x ${f.ag} ${UI.cname(f.a)}${f.hp !== undefined ? ` (pên. ${f.hp}x${f.ap})` : ''}</h2><button class="btn ghost" data-a="closeModal">✕</button></div>
  <div class="grid g2"><div><h3 style="margin-bottom:6px">${esc(comp.name)}: resultados do dia</h3><table class="t"><tbody>${list.map(x => `<tr class="${x === mine ? 'me' : ''}"><td class="r nm">${UI.cname(x.h)}</td><td class="c num"><b>${x.hg} x ${x.ag}</b></td><td class="nm">${UI.cname(x.a)}</td></tr>`).join('')}</tbody></table>${fx.length > 40 ? `<p class="muted">e mais ${fx.length - 40} jogos</p>` : ''}</div>
  <div>${mini ? `<h3 style="margin-bottom:6px">Classificação</h3>${mini}` : ''}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" data-a="report" data-v="${comp.id}:${f.id}">Estatísticas do jogo</button><button class="btn pri" data-a="closeModal" autofocus>Fechar</button></div></div></div>`, true);
};

// ---------------- fim de temporada ----------------
UI.seasonEnd = () => {
  const me = W.clubs[W.user];
  const line = div => { const c = W.comps[div]; return `<tr><td><b>${G.DIV_NAME[div]}</b></td><td>${c.res.champ != null ? UI.cname(c.res.champ) : '–'}</td><td>${c.res.prom.map(UI.cname).join(', ') || '–'}</td><td>${c.res.rel.map(UI.cname).join(', ') || '–'}</td></tr>`; };
  const uc = W.comps[me.div];
  let verdict = 'Temporada encerrada.';
  if (uc.res.champ === W.user) verdict = 'Campeão! Que temporada.';
  else if (uc.res.prom.includes(W.user)) verdict = 'Acesso garantido! Ano que vem, divisão de cima.';
  else if (uc.res.rel.includes(W.user)) verdict = 'Rebaixado. Hora de reconstruir.';
  const box = UI.modal(`<div class="mh"><h2>Fim da temporada ${W.year}</h2></div><p style="font-size:18px;margin:0 0 14px"><b>${verdict}</b></p>
  <table class="t"><thead><tr><th>Divisão</th><th>Campeão</th><th>Acesso</th><th>Rebaixados</th></tr></thead><tbody>${G.DIVS.map(line).join('')}</tbody></table>
  ${(() => { const last = G.youth(W, W.user).filter(p => p.a >= 20); W.youthDecisions = W.youthDecisions || {}; return last.length ? `<h3 style="margin:16px 0 6px">Base: quem completa 21 anos</h3><p class="note" style="margin:0 0 8px">Esses garotos não podem mais ficar na base. Escolha quem sobe para o profissional.</p><table class="t"><tbody>${last.map(p => { const rec = W.youthDecisions[p.id] || G.youthRecommend(W, p); W.youthDecisions[p.id] = rec; return `<tr><td>${UI.pos(p.p)}</td><td class="nm">${esc(p.n)} <span class="dim">${p.a} anos</span></td><td class="c">${UI.ovr(G.ovr(p))}</td><td class="c dim num">${UI.potTxt(p)}</td><td class="r"><select data-c="yDec" data-id="${p.id}"><option value="up" ${rec === 'up' ? 'selected' : ''}>Subir para o profissional</option><option value="out" ${rec === 'out' ? 'selected' : ''}>Dispensar</option></select></td></tr>`; }).join('')}</tbody></table>` : ''; })()}
  <p class="note" style="margin-top:12px">Na virada, os jogadores envelhecem e evoluem (ou caem de rendimento), veteranos se aposentam e a peneira traz novos garotos para a base.</p>
  <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn pri big" data-a="newSeason" autofocus>Começar ${W.year + 1}</button></div>`, true);
  box.dataset.lock = '1';
};
UI.act.newSeason = () => { UI.closeModal(); G.endSeason(W); UI.save(); UI.go('home'); UI.toast('Nova temporada: ' + W.year + '.'); };

UI.chg.yDec = (v, el) => { W.youthDecisions = W.youthDecisions || {}; W.youthDecisions[+el.dataset.id] = v; };

UI.render();
UI.initCaps();
</script>
</body>
</html>
